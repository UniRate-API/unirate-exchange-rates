name: Update dataset

# Refresh the published figures daily. Uses only curl + jq (preinstalled on the
# runner) — no package manager, no third-party build dependency.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Regenerate CSVs from the UniRate API
        env:
          UNIRATE_API_KEY: ${{ secrets.UNIRATE_API_KEY }}
        run: ./scripts/update.sh

      - name: Commit if the data changed
        run: |
          git config user.name "rob-browncc"
          git config user.email "199503049+rob-browncc@users.noreply.github.com"
          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "data: daily refresh ($(date -u +%F))"
            git push
          else
            echo "No change in data/ — nothing to commit."
          fi
